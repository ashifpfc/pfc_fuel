<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#15171c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>PFC Fuel Tracker</title>
<style>
  :root {
    --ink:#15171c; --ink2:#2a2e36; --acc:#f5a524; --bg:#f2f4f7; --card:#fff; --line:#e3e7ed; --muted:#6b7280; --text:#1b1f27;
    --direct:#2563eb; --indirect:#f59e0b; --rec:#10b981; --bad:#dc2626; --warn:#b45309; --ok:#059669;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 4px 14px rgba(16,24,40,.06);
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI", Roboto, "Noto Sans Devanagari", Arial, sans-serif; background:var(--bg); color:var(--text); font-size:15px; }
  header { background:linear-gradient(120deg, #101216 0%, #23272f 100%); color:#fff; padding:10px 16px; display:flex; align-items:center; gap:12px; }
  header img { height:40px; display:block; }
  .htitle { border-left:1px solid rgba(255,255,255,.25); padding-left:12px; line-height:1.15; }
  .htitle b { font-size:16px; letter-spacing:.3px; display:block; }
  .htitle span { font-size:12px; color:#c9ced8; }
  #syncBtn { margin-left:auto; border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.08); color:#fff; border-radius:20px; padding:7px 13px; font-size:13px; cursor:pointer; white-space:nowrap; }
  nav { display:flex; overflow-x:auto; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; scrollbar-width:none; }
  nav::-webkit-scrollbar { display:none; }
  nav button { flex:1 0 auto; border:0; background:none; padding:13px 14px; font-size:14px; cursor:pointer; color:var(--muted); border-bottom:3px solid transparent; }
  nav button.on { color:var(--ink); font-weight:700; border-bottom-color:var(--acc); }
  main { max-width:1200px; margin:0 auto; padding:16px; }
  .tab { display:none; } .tab.on { display:block; animation:fade .25s ease; }
  @keyframes fade { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow); }
  h3 { margin:2px 0 12px; font-size:15px; color:var(--ink); display:flex; align-items:center; gap:8px; }
  h3 small { font-weight:400; color:var(--muted); font-size:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px; margin-bottom:12px; }
  label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); }
  input, select, textarea { font-size:15px; padding:9px 10px; border:1px solid #cfd5de; border-radius:9px; background:#fff; color:var(--text); width:100%; font-family:inherit; }
  textarea { font-family:Consolas, monospace; font-size:13px; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--acc); border-color:transparent; }
  .radio { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; margin:4px 0 14px; padding:10px 12px; background:#fff7e6; border-radius:10px; }
  .radio label { flex-direction:row; align-items:center; gap:6px; color:var(--text); font-size:14px; }
  .radio input { width:auto; }
  button.primary, button.sec, button.mini, .filebtn { border:0; border-radius:9px; cursor:pointer; font-family:inherit; }
  button.primary { background:var(--ink); color:#fff; font-weight:600; padding:11px 22px; font-size:15px; }
  button.primary:hover { background:var(--ink2); }
  button.sec, .filebtn { background:#eef1f5; color:var(--ink); padding:10px 15px; font-size:14px; display:inline-flex; align-items:center; gap:6px; }
  button.mini { background:#eef1f5; color:var(--ink); padding:5px 10px; font-size:12px; }
  button:disabled { opacity:.55; cursor:wait; }
  .info { font-size:13px; background:#f1f5fb; border-radius:9px; padding:8px 10px; margin:-4px 0 12px; color:var(--ink2); }
  .info:empty { display:none; }
  .chip { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; }
  .chip.Direct { background:#dbe7ff; color:#1d4ed8; } .chip.Indirect { background:#fdecc8; color:#92400e; }
  .alert { border-radius:12px; padding:10px 12px; margin-bottom:10px; font-size:14px; }
  .alert.q { background:#fff4d6; color:#6b4b00; } .alert.e { background:#fde8e7; color:#8a1c17; } .alert.w { background:#fff0e0; color:var(--warn); }
  .alert .row { display:flex; gap:8px; align-items:center; justify-content:space-between; padding:6px 0; border-top:1px solid rgba(0,0,0,.06); font-size:13px; }
  .alert .row:first-of-type { border-top:0; }

  /* KPI tiles */
  .kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px; margin-bottom:14px; }
  .kpi { background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 14px 12px; box-shadow:var(--shadow); position:relative; overflow:hidden; }
  .kpi::before { content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--c, var(--ink)); }
  .kpi .t { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.4px; }
  .kpi .v { font-size:26px; font-weight:800; margin-top:4px; color:var(--ink); }
  .kpi .v small { font-size:13px; font-weight:600; color:var(--muted); }
  .kpi .s { font-size:12px; color:var(--muted); margin-top:4px; }
  .stockcards { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:12px; margin-bottom:14px; }
  .stockc { border-radius:16px; padding:16px; color:#fff; box-shadow:var(--shadow); position:relative; overflow:hidden; }
  .stockc.Diesel { background:linear-gradient(135deg, #15171c, #343a46); }
  .stockc.Petrol { background:linear-gradient(135deg, #7c2d12, #c2410c); }
  .stockc .t { font-size:13px; opacity:.85; }
  .stockc .v { font-size:34px; font-weight:800; margin:4px 0 2px; }
  .stockc .v small { font-size:15px; opacity:.8; }
  .stockc .s { font-size:13px; opacity:.9; }
  .bar { height:8px; background:rgba(255,255,255,.18); border-radius:10px; overflow:hidden; margin-top:10px; }
  .bar i { display:block; height:100%; border-radius:10px; background:var(--acc); transition:width .6s ease; }
  .stockc .drop { position:absolute; right:-10px; top:-10px; font-size:90px; opacity:.08; }

  .charts { display:grid; grid-template-columns:2fr 1fr; gap:14px; }
  .charts > .card { min-width:0; }
  .charts.three { grid-template-columns:repeat(3, 1fr); }
  .charts.two { grid-template-columns:1fr 1fr; }
  .cbox { position:relative; height:280px; }
  .cbox.tall { height:340px; }
  @media (max-width: 860px) { .charts, .charts.three, .charts.two { grid-template-columns:1fr; } }
  @media (max-width: 600px) { header { padding:8px 12px; gap:10px; } header img { height:30px; } .htitle { padding-left:10px; } .htitle b { font-size:14px; } .htitle span { display:none; } #syncBtn { padding:6px 10px; font-size:12px; } .kpi .v { font-size:22px; } main { padding:12px; } }

  .entry { display:flex; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .entry:last-child { border-bottom:0; }
  .badge { font-size:11px; font-weight:700; padding:4px 8px; border-radius:7px; color:#fff; min-width:44px; text-align:center; }
  .badge.IN { background:var(--rec); } .badge.OUT { background:#ea580c; }
  .entry .m { flex:1; min-width:0; }
  .entry .m div:first-child { font-weight:600; }
  .entry .m div:last-child { font-size:12px; color:var(--muted); }
  .entry .q { font-weight:800; white-space:nowrap; }
  .pend { font-size:11px; color:var(--warn); font-weight:600; }
  .x { border:0; background:none; color:var(--bad); font-size:18px; cursor:pointer; padding:4px 6px; }
  .quick { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .quick button { border:1px solid var(--line); background:#fff; border-radius:20px; padding:6px 13px; cursor:pointer; font-size:13px; }
  .quick button.on, .quick button:hover { border-color:var(--ink); background:var(--ink); color:#fff; }
  .tw { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { border-bottom:1px solid var(--line); padding:8px 9px; text-align:left; white-space:nowrap; }
  th { background:#f6f7f9; color:var(--ink2); font-weight:700; position:sticky; top:0; }
  td.n, th.n { text-align:right; }
  tr:hover td { background:#fafbfc; }
  .muted { color:var(--muted); }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; align-items:center; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 18px; border-radius:10px; font-size:14px; max-width:92%; display:none; z-index:30; box-shadow:0 8px 24px rgba(0,0,0,.2); }
  #toast.err { background:var(--bad); }

  /* report header */
  .rhead { display:flex; align-items:center; gap:16px; padding:18px; border-radius:16px; background:linear-gradient(120deg, #101216, #2a2f39); color:#fff; margin-bottom:14px; }
  .rhead img { height:58px; }
  .rhead h2 { margin:0 0 4px; font-size:20px; }
  .rhead .meta { font-size:13px; color:#cfd4dc; }
  .rhead .chips span { display:inline-block; background:rgba(255,255,255,.12); border-radius:20px; padding:2px 9px; font-size:12px; margin:6px 4px 0 0; }
  .rhead .logo-print { display:none; }
  .seg { display:inline-flex; background:#eef1f5; border-radius:10px; padding:4px; gap:4px; margin-bottom:12px; }
  .seg label { flex-direction:row; padding:7px 14px; border-radius:8px; cursor:pointer; color:var(--ink2); font-size:14px; }
  .seg input { display:none; }
  .seg label:has(input:checked) { background:#fff; box-shadow:var(--shadow); font-weight:700; color:var(--ink); }
  .colchips { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 12px; }
  .colchips span { background:#f1f5fb; border:1px dashed #b9c4d4; border-radius:7px; padding:3px 8px; font-size:12px; }
  .detailbox .tw { max-height:520px; overflow:auto; }
  tr.bad td { background:#fff1f0; } tr.warn td { background:#fff8eb; }

  @media print {
    @page { size:A4; margin:10mm; }
    header, nav, .noprint, #toast { display:none !important; }
    body { background:#fff; font-size:12px; } main { padding:0; max-width:none; }
    .tab { display:none !important; } #rep { display:block !important; }
    .card, .kpi { box-shadow:none; break-inside:avoid; }
    .rhead { background:#fff !important; color:#000; border:2px solid #15171c; }
    .rhead .meta { color:#333; } .rhead .chips span { background:#eee; }
    .rhead .logo-screen { display:none; } .rhead .logo-print { display:block; }
    .charts, .charts.three, .charts.two { grid-template-columns:1fr 1fr; }
    .charts:not(.two):not(.three) { grid-template-columns:3fr 2fr; }
    .cbox, .cbox.tall { height:auto; }
    .cbox canvas { max-width:100% !important; height:auto !important; }
    .charts > .card { min-width:0; }
    th, td { white-space:normal; padding:4px 5px; }
    th { position:static; }
    .detailbox .tw { max-height:none; overflow:visible; }
  }
  /* language: Store mode shows English under Hindi */
  .en { display:block; font-size:.78em; opacity:.72; font-weight:400; font-style:normal; line-height:1.2; }
  nav button .en { font-size:10.5px; }
  h3 .en { display:inline; margin-left:6px; }
  .badge .en, .chip .en { display:inline; font-size:inherit; opacity:.85; }
  #toast { white-space:pre-line; }
  #langBtn { border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.08); color:#fff; border-radius:20px; padding:7px 11px; font-size:12px; cursor:pointer; white-space:nowrap; }
  .modecards { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:12px; }
  .modecard { border:2px solid var(--line); border-radius:14px; padding:14px; cursor:pointer; background:#fff; text-align:left; font-family:inherit; }
  .modecard b { font-size:15px; display:block; margin-bottom:4px; color:var(--ink); }
  .modecard span { font-size:13px; color:var(--muted); }
  .modecard.on { border-color:var(--acc); box-shadow:0 0 0 3px rgba(245,165,36,.2); }
</style>
</head>
<body>
<header>
  <img src="logo-white.png" alt="PFC Group">
  <div class="htitle"><b>Fuel Management</b><span>Diesel · Petrol Tracking</span></div>
  <button id="syncBtn">…</button>
  <button id="langBtn" title="Language / भाषा">EN</button>
</header>

<nav id="tabs">
  <button data-t="dash" class="on"><span data-i="tabDash"></span></button>
  <button data-t="rec"><span data-i="tabRec"></span></button>
  <button data-t="iss"><span data-i="tabIss"></span></button>
  <button data-t="bulk"><span data-i="tabBulk"></span></button>
  <button data-t="rep"><span data-i="tabRep"></span></button>
  <button data-t="mst"><span data-i="tabMst"></span></button>
  <button data-t="set"><span data-i="tabSet"></span></button>
</nav>

<main>
<!-- ============ DASHBOARD ============ -->
<section id="dash" class="tab on">
  <div id="alerts"></div>
  <div class="stockcards" id="stockCards"></div>
  <div class="kpis" id="monthKpis"></div>
  <div class="charts">
    <div class="card"><h3><span data-i="c30"></span> <small data-i="c30s"></small></h3><div class="cbox"><canvas id="cTrend"></canvas></div></div>
    <div class="card"><h3><span data-i="cMonth"></span> <small data-i="cMonthS"></small></h3><div class="cbox"><canvas id="cCat"></canvas></div></div>
  </div>
  <div class="charts">
    <div class="card"><h3><span data-i="cTop"></span> <small data-i="cTopS"></small></h3><div class="cbox"><canvas id="cTop"></canvas></div></div>
    <div class="card"><h3 data-i="recent"></h3><div id="recent" style="max-height:280px;overflow:auto"></div></div>
  </div>
</section>

<!-- ============ RECEIVE ============ -->
<section id="rec" class="tab">
  <form id="fRec" class="card" autocomplete="off">
    <h3 data-i="recTitle"></h3>
    <div class="grid">
      <label><span data-i="date"></span> <input type="date" name="date" required></label>
      <label><span data-i="vendor"></span> <input name="vendor" list="vendorList" required data-ip="vendorPh"></label>
      <label><span data-i="dn"></span> <input name="dn" data-ip="dnPh"></label>
      <label><span data-i="fuel"></span> <select name="fuel" id="recFuel"><option>Diesel</option><option>Petrol</option></select></label>
      <label><span data-i="qty"></span> <input type="number" step="0.01" min="0" name="qty" required></label>
      <label><span data-i="rate"></span> <input type="number" step="0.01" min="0" name="rate"></label>
    </div>
    <div class="radio">
      <b data-i="whereTo"></b>
      <label><input type="radio" name="destination" value="Store Barrel" checked> <span data-i="toBarrel"></span></label>
      <label><input type="radio" name="destination" value="Direct"> <span data-i="toDirect"></span></label>
    </div>
    <div id="directBox" hidden>
      <div class="grid">
        <label><span data-i="asset"></span> <select name="assetCode" id="recAsset"></select></label>
        <label><span id="recMeterTxt"></span> <input type="number" step="0.1" min="0" name="meter"></label>
        <label><span data-i="takenBy"></span> <input name="takenBy"></label>
      </div>
      <div class="info" id="recInfo"></div>
    </div>
    <div class="grid">
      <label><span data-i="storeMan"></span> <input name="receivedBy" class="myname" required></label>
      <label><span data-i="remarks"></span> <input name="remarks"></label>
    </div>
    <button class="primary" type="submit" data-i="save"></button>
  </form>
</section>

<!-- ============ ISSUE ============ -->
<section id="iss" class="tab">
  <form id="fIss" class="card" autocomplete="off">
    <h3 data-i="issTitle"></h3>
    <div class="grid">
      <label><span data-i="date"></span> <input type="date" name="date" required></label>
      <label><span data-i="issAsset"></span> <select name="assetCode" id="issAsset" required></select></label>
      <label><span data-i="qty"></span> <input type="number" step="0.01" min="0" name="qty" required></label>
      <label><span id="issMeterTxt"></span> <input type="number" step="0.1" min="0" name="meter"></label>
    </div>
    <div class="info" id="issInfo"></div>
    <div class="grid">
      <label><span data-i="takenBy"></span> <input name="takenBy" required></label>
      <label><span data-i="storeMan"></span> <input name="issuedBy" class="myname" required></label>
      <label><span data-i="remarks"></span> <input name="remarks"></label>
    </div>
    <button class="primary" type="submit" data-i="save"></button>
  </form>
</section>

<!-- ============ BULK ============ -->
<section id="bulk" class="tab">
  <div class="card">
    <h3 data-i="bulkTitle"></h3>
    <p class="muted" style="margin-top:-4px;font-size:13px" data-i="bulkHelp"></p>
    <div class="seg" id="bulkTypeSeg">
      <label><input type="radio" name="bulkType" value="issue" checked> <span data-i="bulkIssue"></span></label>
      <label><input type="radio" name="bulkType" value="receipt"> <span data-i="bulkReceipt"></span></label>
    </div>
    <div id="bulkSrcBox" class="grid" style="max-width:560px">
      <label><span data-i="bulkSrcQ"></span>
        <select id="bulkSrc">
          <option value="outside" data-i="srcOutside"></option>
          <option value="barrel" data-i="srcBarrel"></option>
        </select></label>
    </div>
    <div class="muted" style="font-size:13px" data-i="colsOrder"></div>
    <div class="colchips" id="bulkCols"></div>
    <div class="actions">
      <button class="sec" id="btnTpl" type="button"><span data-i="tplBtn"></span></button>
      <label class="filebtn"><span data-i="fileBtn"></span> <input type="file" id="bulkFile" accept=".csv,.txt,.tsv" hidden></label>
      <span class="muted" style="font-size:12px" data-i="dateFmt"></span>
    </div>
    <textarea id="bulkText" rows="8" data-ip="pasteHere"></textarea>
    <div class="grid" style="margin-top:12px;max-width:560px">
      <label><span data-i="enteredBy"></span> <input id="bulkBy" class="myname"></label>
    </div>
    <button class="primary" id="btnCheck" type="button" data-i="checkBtn"></button>
  </div>
  <div id="bulkPreview"></div>
</section>

<!-- ============ REPORT ============ -->
<section id="rep" class="tab">
  <div class="card noprint">
    <h3><span data-i="repTitle"></span> <small data-i="needNetSmall"></small></h3>
    <div class="quick" id="quick">
      <button data-r="today"><span data-i="qToday"></span></button>
      <button data-r="yest"><span data-i="qYest"></span></button>
      <button data-r="7"><span data-i="q7"></span></button>
      <button data-r="15"><span data-i="q15"></span></button>
      <button data-r="month"><span data-i="qMonth"></span></button>
      <button data-r="lastmonth"><span data-i="qLastMonth"></span></button>
      <button data-r="year"><span data-i="qYear"></span></button>
    </div>
    <div class="grid">
      <label>From <input type="date" id="rFrom"></label>
      <label>To <input type="date" id="rTo"></label>
      <label><span data-i="fuel"></span> <select id="rFuel"><option value="" data-i="all"></option><option>Diesel</option><option>Petrol</option></select></label>
      <label><span data-i="consType"></span> <select id="rCat"><option value="" data-i="all"></option><option value="Direct" data-i="direct"></option><option value="Indirect" data-i="indirect"></option></select></label>
      <label><span data-i="asset"></span> <select id="rAsset"></select></label>
      <label><span data-i="vendor"></span> <select id="rVendor"></select></label>
    </div>
    <button class="primary" id="btnRep" data-i="makeRep"></button>
  </div>
  <div class="actions noprint" id="repActions" hidden>
    <button class="sec" onclick="window.print()">🖨 Print / PDF</button>
    <button class="sec" onclick="downloadCsv()">⬇ Excel (CSV)</button>
    <button class="sec" id="btnExport">📄 Save to Google Sheet</button>
    <label style="flex-direction:row;align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="prDetails" style="width:auto"> Print all transactions too</label>
  </div>
  <div id="repOut"></div>
</section>

<!-- ============ MASTERS ============ -->
<section id="mst" class="tab">
  <form id="fAsset" class="card" autocomplete="off">
    <h3 data-i="addAssetTitle"></h3>
    <div class="grid">
      <label><span data-i="codeLbl"></span> <input name="code" required></label>
      <label><span data-i="nameLbl"></span> <input name="name" required></label>
      <label><span data-i="typeLbl"></span> <select name="type" id="aType"><option>Vehicle</option><option>Generator</option><option>Machine</option><option>Other</option></select></label>
      <label><span data-i="consType"></span> <select name="category" id="aCat"><option value="Direct" data-i="direct"></option><option value="Indirect" data-i="indirect"></option></select></label>
      <label><span data-i="fuel"></span> <select name="fuel"><option>Diesel</option><option>Petrol</option></select></label>
      <label><span data-i="meterLbl"></span> <select name="meter"><option value="KM" data-i="optKm"></option><option value="Hours" data-i="optHrs"></option></select></label>
      <label><span data-i="locLbl"></span> <input name="location" data-ip="locPh"></label>
    </div>
    <button class="primary" type="submit" data-i="addBtn"></button>
  </form>
  <div class="card">
    <h3 data-i="allAssets"></h3>
    <div id="assetList"></div>
    <p class="muted" style="font-size:13px" data-i="assetEditHelp"></p>
  </div>
</section>

<!-- ============ SETTINGS ============ -->
<section id="set" class="tab">
  <div class="card">
    <h3>App Mode / ऐप मोड</h3>
    <div class="modecards">

let LANG = (() => { try { return JSON.parse(localStorage.getItem('fuel_lang')) || 'bi'; } catch (e) { return 'bi'; } })();
const UNITS = { GAL: { s: 'GAL', p: 'gallons', one: 'gallon', q: 'Gallons', h: 'गैलन' }, L: { s: 'L', p: 'litres', one: 'litre', q: 'Litres', h: 'लीटर' } };
const U = () => (typeof base !== 'undefined' && base && base.unit) || 'GAL';
const UN = () => UNITS[U()] || UNITS.GAL;
const fill = (s, a) => String(s).replace(/\{(\d)\}/g, (m, i) => a[i] == null ? '' : a[i])
  .replace(/\{U\}/g, UN().s).replace(/\{UP\}/g, UN().p).replace(/\{U1\}/g, UN().one).replace(/\{UQ\}/g, UN().q).replace(/\{UH\}/g, UN().h);
/** plain text: English, or "हिंदी / English" */
function t(k) { const a = [].slice.call(arguments, 1), v = D[k] || [k, k]; return LANG === 'en' ? fill(v[0], a) : fill(v[1], a) + ' / ' + fill(v[0], a); }
/** long text (toast / confirm): Hindi line + English line */
function tm(k) { const a = [].slice.call(arguments, 1), v = D[k] || [k, k]; return LANG === 'en' ? fill(v[0], a) : fill(v[1], a) + '\n' + fill(v[0], a); }
/** short text that must stay short (badges, chart labels): Hindi only in Store mode */
function ts(k) { const a = [].slice.call(arguments, 1), v = D[k] || [k, k]; return LANG === 'en' ? fill(v[0], a) : fill(v[1], a); }
/** server message: comes as "हिंदी␞English", shown in the current mode */
function sx(m) { const p = String(m == null ? '' : m).split('\u241E'); return p.length < 2 ? p[0] : LANG === 'en' ? p[1] : p[0] + ' / ' + p[1]; }
/** HTML: Hindi with small English underneath */
function th(k) {
  const a = [].slice.call(arguments, 1), v = D[k] || [k, k];
  if (LANG === 'en') return esc(fill(v[0], a));
  const sub = fill(v[0], a).replace(/^[\u2190-\u2BFF\u{1F000}-\u{1FFFF}\uFE0F\s]+/u, '');   // icon सिर्फ़ हिंदी लाइन में
  return esc(fill(v[1], a)) + '<i class="en">' + esc(sub) + '</i>';
}

function applyLang() {
  document.documentElement.lang = LANG === 'en' ? 'en' : 'hi';
  document.querySelectorAll('[data-i]').forEach(el => {
    const k = el.dataset.i;
    if (el.tagName === 'OPTION') el.textContent = t(k); else el.innerHTML = th(k);
  });
  document.querySelectorAll('[data-ip]').forEach(el => el.placeholder = t(el.dataset.ip));
  $('langBtn').textContent = LANG === 'en' ? 'EN' : 'हिं / EN';
  document.querySelectorAll('.modecard').forEach(b => b.classList.toggle('on', b.dataset.mode === LANG));
  if (typeof bulkUi === 'function') bulkUi();
  render();
  if (lastReport) renderReport(lastReport);
}
function setLang(l) {
  LANG = l; try { localStorage.setItem('fuel_lang', JSON.stringify(l)); } catch (e) {}
  applyLang(); toast(LANG === 'en' ? D.modeSet[0] : D.modeSet[1]);
}

}

const pad = n => String(n).padStart(2, '0');

const nowTs = () => { const d = new Date(); return fmt(d) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(/,/g, '')); return isNaN(n) ? 0 : n; };
const r2 = n => Math.round(n * 100) / 100;
const nf = n => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 1 });

/* ================= Server API ================= */
async function api(action, payload) {
  const ctrl = new AbortController(), tmr = setTimeout(() => ctrl.abort(), 60000);
  let res;
  try {
    res = await fetch(cfg.url, {
      method: 'POST', redirect: 'follow', signal: ctrl.signal,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action: action, pin: cfg.pin, lang: 'pair' }, payload || {}))
    });
  } catch (e) {
    netOk = false;
    const err = new Error(tm('noNet')); err.net = true; throw err;
  } finally { clearTimeout(tmr); }
  netOk = true;
  let j;
  try { j = await res.json(); }
  catch (e) { throw new Error(tm('badResp')); }
  if (!j.ok) throw new Error(sx(j.error || 'Server error'));
  return j;
}

/* ================= Local view = server data + pending entries ================= */
function blankMonth() { return { rec: { Diesel: 0, Petrol: 0 }, Direct: { Diesel: 0, Petrol: 0 }, Indirect: { Diesel: 0, Petrol: 0 }, assets: {} }; }

function view() {
  const s = JSON.parse(JSON.stringify(base));
  const td = today();
  s.stock = s.stock || {}; s.todaySum = s.todaySum || {}; s.lastMeter = s.lastMeter || {}; s.recent = s.recent || [];
  s.dash = s.dash || { trend: {}, month: blankMonth(), monthStart: monthStart(), avg30: {} };
  if (s.dash.monthStart !== monthStart()) { s.dash.month = blankMonth(); s.dash.monthStart = monthStart(); }
  if (s.today !== td) { s.today = td; s.todaySum = {}; }
  FUELS.forEach(f => { if (s.stock[f] == null) s.stock[f] = 0; if (!s.todaySum[f]) s.todaySum[f] = { in: 0, out: 0 }; });
  queue.forEach(op => applyOp(s, op));
  FUELS.forEach(f => { s.stock[f] = r2(s.stock[f]); s.todaySum[f].in = r2(s.todaySum[f].in); s.todaySum[f].out = r2(s.todaySum[f].out); });
  s.recent.sort((a, b) => String(b.ts).localeCompare(String(a.ts)));
  return s;
}

function addTrend(s, date, key, q) {
  const tr = s.dash.trend;
  if (!tr[date]) tr[date] = { rec: 0, Direct: 0, Indirect: 0 };
  tr[date][key] += q;
}
function addCons(s, date, code, fuel, q) {
  const cat = catOf(s.assets.find(x => x.code === code));
  addTrend(s, date, cat, q);
  if (date >= s.dash.monthStart && date <= s.today) {
    s.dash.month[cat][fuel] = (s.dash.month[cat][fuel] || 0) + q;
    s.dash.month.assets[code] = (s.dash.month.assets[code] || 0) + q;
  }
}

function applyOp(s, op) {
  const d = op.data, q = num(d.qty), td = s.today;
  if (op.type === 'receipt') {
    const barrel = d.destination !== 'Direct';
    if (barrel) s.stock[d.fuel] += q;
    if (d.date === td) { s.todaySum[d.fuel].in += q; if (!barrel) s.todaySum[d.fuel].out += q; }
    addTrend(s, d.date, 'rec', q);
    if (d.date >= s.dash.monthStart && d.date <= td) s.dash.month.rec[d.fuel] += q;
    if (!barrel) {
      addCons(s, d.date, d.assetCode, d.fuel, q);
      if (d.meter !== '') s.lastMeter[d.assetCode] = { reading: num(d.meter), date: d.date };
    }
    if (d.vendor && s.vendors.indexOf(d.vendor) < 0) s.vendors.push(d.vendor);
    s.recent.unshift({ kind: 'IN', id: op.id, ts: op.ts, date: d.date, fuel: d.fuel, qty: q,
      party: d.vendor + (d.dn ? ' (DN ' + d.dn + ')' : ''), dest: barrel ? 'barrel' : 'direct', asset: d.assetCode, meter: '',
      by: d.receivedBy, barrel: barrel, pending: true });
  } else if (op.type === 'issue') {
    const a = s.assets.find(x => x.code === d.assetCode) || { name: '', fuel: d.fuel };
    const fuel = a.fuel || d.fuel;
    const barrel = d.source !== 'outside';
    if (barrel) s.stock[fuel] = (s.stock[fuel] || 0) - q;
    if (d.date === td) s.todaySum[fuel].out += q;
    addCons(s, d.date, d.assetCode, fuel, q);
    if (d.meter !== '' && (!s.lastMeter[d.assetCode] || d.date >= s.lastMeter[d.assetCode].date))
      s.lastMeter[d.assetCode] = { reading: num(d.meter), date: d.date };
    if (barrel) s.recent.unshift({ kind: 'OUT', id: op.id, ts: op.ts, date: d.date, fuel: fuel, qty: q,
      party: d.assetCode + ' – ' + a.name, asset: d.assetCode, meter: d.meter, by: d.takenBy, barrel: true, pending: true });
  } else if (op.type === 'void') {
    const i = s.recent.findIndex(x => x.id === d.id);
    if (i >= 0) {
      const x = s.recent[i];
      if (x.barrel) s.stock[x.fuel] += x.kind === 'IN' ? -x.qty : x.qty;
      if (x.date === td) {
        if (x.kind === 'IN') { s.todaySum[x.fuel].in -= x.qty; if (!x.barrel) s.todaySum[x.fuel].out -= x.qty; }
        else s.todaySum[x.fuel].out -= x.qty;
      }
      s.recent.splice(i, 1);
    }
  } else if (op.type === 'asset') {
    if (!s.assets.some(a => a.code === d.code))
      s.assets.push({ code: d.code, name: d.name, type: d.type, fuel: d.fuel, meter: d.meter || 'KM', location: d.location, category: d.category });
  }
}

function describe(op) {
  const d = op.data;
  if (op.type === 'receipt') return ts('dRec', d.qty, d.fuel, d.vendor, d.date);
  if (op.type === 'issue') return ts('dIss', d.qty, d.assetCode, d.date);
  if (op.type === 'void') return ts('dVoid', d.id);
  if (op.type === 'asset') return ts('dAsset', d.code);
  return op.type;
}
/** text under each recent entry, built in the current language */
function recentInfo(r) {
  if (r.kind === 'IN') return r.dest === 'direct' || (r.barrel === false) ? ts('directTo', r.asset || '') : ts('storeBarrel');
  return r.meter !== '' && r.meter != null ? ts('meterV', r.meter) : '';
}

/* ================= Queue + Sync ================= */
function makeOp(type, data) {
  return { id: newId({ receipt: 'R', issue: 'I', void: 'V', asset: 'A' }[type]), type: type, ts: nowTs(), data: data };
}
function addOps(ops) {
  const before = queue.length;
  queue.push.apply(queue, ops);
  if (!save(K.queue, queue)) { queue.length = before; return false; }
  render();
  trySync();
  return true;
}
function addOp(type, data) { return addOps([makeOp(type, data)]); }

function handleResults(results) {
  const map = {};
  (results || []).forEach(r => map[r.id] = r);
  let handled = 0;
  queue = queue.filter(op => {
    const r = map[op.id];
    if (!r) return true;
    handled++;
    if (!r.ok) errors.push({ op: op, error: r.error, at: nowTs() });
    else (r.warnings || []).forEach(w => warns.push({ op: op, w: w, at: nowTs() }));
    return false;
  });
  save(K.queue, queue); save(K.errors, errors); save(K.warns, warns);
  return handled;
}

async function trySync(manual) {
  if (syncing) return;
  if (!cfg.url || !cfg.pin) {
    if (manual) { toast(tm('setupFirst'), true); showTab('set'); }
    return;
  }
  syncing = true; setStatus();
  try {
    for (let round = 0; round < 40; round++) {
      const batch = queue.slice(0, 25);
      const res = await api(batch.length ? 'sync' : 'init', batch.length ? { ops: batch } : {});
      const handled = batch.length ? handleResults(res.results) : 0;
      base = res.init; save(K.base, base);
      lastSync = nowTs(); save(K.last, lastSync);
      if (!queue.length || handled === 0) break;
      setStatus();
    }
    if (manual) toast(errors.length ? tm('syncIssues') : tm('syncDone'), !!errors.length);
  } catch (e) {
    if (manual || !e.net) toast(e.message, true);
  } finally {
    syncing = false;
    render();
  }
}

function setStatus() {
  const b = $('syncBtn'), n = queue.length;
  if (syncing) b.textContent = '🔄 ' + ts('syncing') + (n ? ' (' + n + ')' : '…');
  else if (!cfg.url) b.textContent = '⚙ ' + ts('setupBtn');
  else if (!netOk) b.textContent = '🔴 ' + ts('offline') + (n ? ' · ' + ts('pending', n) : '');
  else if (n) b.textContent = '🟡 ' + ts('pending', n) + ' · ' + ts('syncAct');
  else b.textContent = '🟢 ' + ts('allSynced');
}

                      ['02/10/2026', 'ADNOC Vendor', 'DN-1002', 'Diesel', '300', '', 'GEN-01', '1500', 'Direct fill']] }
};

function csvSplit(line, dl) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (q) { if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === dl) { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}
function splitRows(text) {
  const lines = String(text).replace(/\r/g, '').split('\n').filter(l => l.trim());
  const dl = lines.some(l => l.indexOf('\t') >= 0) ? '\t' : (lines.some(l => l.indexOf(';') >= 0) && !lines.some(l => l.indexOf(',') >= 0) ? ';' : ',');
  return lines.map(l => (dl === '\t' ? l.split('\t') : csvSplit(l, dl)).map(c => c.trim()));
}
const MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
function parseDate(v) {
  const s = String(v || '').trim(); let m, y, mo, d;
  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) { y = +m[1]; mo = +m[2]; d = +m[3]; }
  else if ((m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/))) { d = +m[1]; mo = +m[2]; y = +m[3]; }
  else if ((m = s.match(/^(\d{1,2})[-\s/]([A-Za-z]{3})[A-Za-z]*[-\s/,]+(\d{2,4})$/))) { d = +m[1]; mo = MON[m[2].toLowerCase()]; y = +m[3]; }
  else return '';
  if (y < 100) y += 2000;
  const dt = new Date(y, mo - 1, d);
  return dt.getFullYear() === y && dt.getMonth() === mo - 1 && dt.getDate() === d ? fmt(dt) : '';
}
function parseFuel(v) {
  const s = String(v || '').trim().toLowerCase();
  if (/^(d|diesel|डीज़ल|डीजल)$/.test(s)) return 'Diesel';
  if (/^(p|petrol|gasoline|पेट्रोल)$/.test(s)) return 'Petrol';
  return '';
}
function parseSrc(v, def) {
  const s = String(v || '').trim().toLowerCase();
  if (!s) return def;
  if (/(barrel|store|stock|बैरल|स्टोर)/.test(s)) return 'barrel';
  if (/(out|bahar|direct|ext|बाहर)/.test(s)) return 'outside';
  return null;
}

function checkBulk() {
  const tp = bulkType(), by = $('bulkBy').value.trim();
  let rows = splitRows($('bulkText').value);
  if (rows.length && !parseDate(rows[0][0]) && /[a-zऀ-ॿ]/i.test(rows[0][0])) rows = rows.slice(1);   // header row
  if (!rows.length) return toast(tm('pasteFirst'), true);
  if (!by) return toast(tm('needName'), true);
  const td = today(), defSrc = $('bulkSrc').value;
  const stock = Object.assign({}, S.stock);
  bulkRows = rows.map((c, i) => {
    const r = { n: i + 1, raw: c, errs: [], warn: [] };
    const date = parseDate(c[0]); if (!date) r.errs.push(ts('eDate')); else if (date > td) r.warn.push(ts('eFuture'));
    if (tp === 'issue') {
      const a = findAsset(c[1]); if (!a) r.errs.push(ts('eAsset', c[1] || ''));
      const q = num(String(c[2] || '').replace(/[^\d.,-]/g, '')); if (!(q > 0)) r.errs.push(ts('eLitres'));
      const meter = String(c[3] || '').replace(/,/g, ''); if (meter && isNaN(+meter)) r.errs.push(ts('eMeter'));
      const src = parseSrc(c[5], defSrc); if (!src) r.errs.push(ts('eSrc'));
      if (!r.errs.length) {
        if (src === 'barrel') { stock[a.fuel] -= q; if (stock[a.fuel] < -0.001) r.warn.push(ts('eNeg')); }
        r.data = { date: date, assetCode: a.code, qty: String(q), meter: meter, takenBy: c[4] || '', source: src,
                   issuedBy: by, fuel: a.fuel, remarks: ((c[6] || '') + ' [Bulk]').trim() };
        r.show = [date, a.code + ' – ' + a.name, a.fuel, ts(catOf(a) === 'Direct' ? 'chipD' : 'chipI'), nf(q), meter, src === 'barrel' ? ts('storeBarrel') : ts('outsideOld')];
      }
    } else {
      const vendor = c[1] || ''; if (!vendor) r.errs.push(ts('eVendor'));
      const fuel = parseFuel(c[3]); if (!fuel) r.errs.push(ts('eFuel'));
      const q = num(String(c[4] || '').replace(/[^\d.,-]/g, '')); if (!(q > 0)) r.errs.push(ts('eLitres'));
      let a = null;
      if ((c[6] || '').trim()) { a = findAsset(c[6]); if (!a) r.errs.push(ts('eAsset', c[6])); else if (fuel && a.fuel !== fuel) r.errs.push(ts('eUses', a.code, a.fuel)); }
      const meter = String(c[7] || '').replace(/,/g, ''); if (meter && isNaN(+meter)) r.errs.push(ts('eMeter'));
      if (!r.errs.length) {
        if (!a) stock[fuel] += q;
        r.data = { date: date, vendor: vendor, dn: c[2] || '', fuel: fuel, qty: String(q), rate: String(c[5] || '').replace(/[^\d.]/g, ''),
                   destination: a ? 'Direct' : 'Store Barrel', assetCode: a ? a.code : '', meter: a ? meter : '', takenBy: '',
                   receivedBy: by, remarks: ((c[8] || '') + ' [Bulk]').trim() };
        r.show = [date, vendor, c[2] || '', fuel, nf(q), a ? ts('directTo', a.code) : ts('storeBarrel')];
      }
    }
    return r;
  });
  renderBulk();
}

function renderBulk() {
  const tp = bulkType(), ok = bulkRows.filter(r => !r.errs.length), bad = bulkRows.length - ok.length;
  const sum = {}; ok.forEach(r => { const f = r.data.fuel; sum[f] = (sum[f] || 0) + num(r.data.qty); });
  const head = (tp === 'issue' ? ['hNo', 'date', 'hAsset', 'fuel', 'hType', 'hLitres', 'hMeter', 'hSource', 'hStatus']
                               : ['hNo', 'date', 'vendor', 'hDN', 'fuel', 'hLitres', 'hWent', 'hStatus']).map(k => ts(k));
  const body = bulkRows.map(r => {
    const cls = r.errs.length ? 'bad' : r.warn.length ? 'warn' : '';
    const st = r.errs.length ? '✗ ' + r.errs.join(', ') : r.warn.length ? '⚠ ' + r.warn.join(', ') : '✓';
    const mid = r.errs.length ? `<td colspan="${head.length - 2}">${esc(r.raw.join(' | '))}</td>`
                              : r.show.map(c => `<td>${esc(c)}</td>`).join('');
    return `<tr class="${cls}"><td class="n">${r.n}</td>${mid}<td>${esc(st)}</td></tr>`;
  }).join('');
  $('bulkPreview').innerHTML = `<div class="card">
    <h3>${th('chkTitle')}</h3>
    <div class="kpis">
      <div class="kpi" style="--c:var(--ok)"><div class="t">${th('okRows')}</div><div class="v">${ok.length}</div></div>
      <div class="kpi" style="--c:var(--bad)"><div class="t">${th('badRows')}</div><div class="v">${bad}</div><div class="s">${bad ? esc(ts('notSaved')) : ''}</div></div>
      ${Object.keys(sum).map(f => `<div class="kpi" style="--c:${COL[f]}"><div class="t">${th('totalF', f)}</div><div class="v">${nf(sum[f])} <small>${U()}</small></div></div>`).join('')}
    </div>
    <div class="tw" style="max-height:380px"><table><thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="actions" style="margin-top:12px">
      <button class="primary" id="btnBulkSave" ${ok.length ? '' : 'disabled'}>${th('saveN', ok.length)}</button>
      <button class="sec" onclick="bulkRows=[];$('bulkPreview').innerHTML=''">${th('cancel')}</button>
    </div></div>`;
  const b = $('btnBulkSave');
  if (b) b.onclick = () => {
    const ops = ok.map(r => makeOp(tp, r.data));
    save(K.name, $('bulkBy').value.trim());
    if (addOps(ops)) {
      toast(tm('bulkSaved', ops.length) + '\n' + ts(netOk ? 'bulkSyncing' : 'bulkLater'));
      bulkRows = []; $('bulkPreview').innerHTML = ''; $('bulkText').value = ''; showTab('dash');
    }
  };
}

        d.movement.map(m => [m.fuel, m.opening, m.recBarrel, m.recDirect, m.totalRec, m.issBarrel, m.direct, m.indirect, m.consumed, m.closing]), [1,2,3,4,5,6,7,8,9])}</div>
    <div class="card"><h3>Consumption & Efficiency by Vehicle / Generator / Machine</h3>
      ${table(['Code', 'Name', 'Type', 'Category', 'Location', 'Fuel', 'Fills', UN().q, 'Run', 'Average'],
        d.byAsset.map(a => [a.code, a.name, a.type, chipCat(a.category), a.location, a.fuel, a.count, a.qty, a.run, a.efficiency]), [6, 7])}
      <p class="muted" style="font-size:12px">Average is shown when at least two meter readings exist in the period.</p></div>
    <div class="card"><h3>Receipts by Vendor</h3>
      ${table(['Vendor', 'Deliveries', 'Diesel', 'Petrol', 'Total ' + UN().q, 'Amount (AED)'], d.byVendor.map(v => [v.vendor, v.count, v.Diesel, v.Petrol, v.total, v.amount || '']), [1,2,3,4,5])}</div>
    <div class="card detailcard ${$('prDetails').checked ? '' : 'noprint'}"><h3>Transaction Details <small>${d.details.length} entries</small></h3><div class="detailbox">
      ${table(['Date', 'In / Out', 'Fuel', UN().q, 'Vendor / Asset', 'Place / Source', 'Category', 'Meter', 'By', 'DN / Remarks'],
        d.details.map(x => [x.date, x.kind, x.fuel, x.qty, x.party, x.place, chipCat(x.category), x.meter, x.by, x.ref]), [3])}</div></div>
    <p class="muted" style="text-align:center;font-size:12px">PFC Group · Perfection Frontier Contracting L.L.C. · Fuel Management System</p>`;

  trendChart('rTrend', d.trend.map(x => x.label), d.trend.map(x => x.Direct), d.trend.map(x => x.Indirect), d.trend.map(x => x.rec));
  donut('rCatC', ['Direct', 'Indirect'], [T.direct, T.indirect], [COL.Direct, COL.Indirect], L(T.consumed), 'total consumed');
  const top = d.byAsset.slice(0, 12);
  hbar('rAssetC', top.map(a => narrow ? a.code : (a.code + ' · ' + a.name).slice(0, 28)), top.map(a => a.qty), top.map(a => COL[a.category]));
  stackBar('rLocC', d.byLocation.map(x => x.key), [
    { label: 'Direct', data: d.byLocation.map(x => x.Direct), backgroundColor: COL.Direct },
    { label: 'Indirect', data: d.byLocation.map(x => x.Indirect), backgroundColor: COL.Indirect }]);
  donut('rTypeC', d.byType.map(x => x.key), d.byType.map(x => x.total), PAL, L(T.consumed), 'by type');
  stackBar('rVendC', d.byVendor.map(v => v.vendor.length > 16 ? v.vendor.slice(0, 15) + '…' : v.vendor), [
    { label: 'Diesel', data: d.byVendor.map(v => v.Diesel), backgroundColor: COL.Diesel },
    { label: 'Petrol', data: d.byVendor.map(v => v.Petrol), backgroundColor: COL.Petrol }]);
}

function downloadCsv() {
  if (!lastReport) return;
  const d = lastReport, rows = [];
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  rows.push(['PFC Group - Fuel Report', d.from + ' to ' + d.to, 'Fuel: ' + d.filters.fuel, 'Category: ' + d.filters.category, 'Asset: ' + d.filters.asset, 'Vendor: ' + d.filters.vendor]);
  rows.push([]);
  rows.push(['SUMMARY']);
  rows.push(['Opening', 'Received', 'Consumed', 'Direct (Vehicles)', 'Indirect (Gen / Laydown)', 'Closing', 'Amount']);
  rows.push([d.totals.opening, d.totals.received, d.totals.consumed, d.totals.direct, d.totals.indirect, d.totals.closing, d.totals.amount]);
  rows.push([]);
  rows.push(['STOCK MOVEMENT']);
  rows.push(['Fuel', 'Opening', 'Recd Barrel', 'Recd Direct', 'Total Received', 'Issued Barrel', 'Direct', 'Indirect', 'Total Consumed', 'Closing']);
  d.movement.forEach(m => rows.push([m.fuel, m.opening, m.recBarrel, m.recDirect, m.totalRec, m.issBarrel, m.direct, m.indirect, m.consumed, m.closing]));
  rows.push([]);
  rows.push(['BY ASSET']);
  rows.push(['Code', 'Name', 'Type', 'Category', 'Location', 'Fuel', 'Fills', 'Qty (' + U() + ')', 'Run', 'Average']);
  d.byAsset.forEach(a => rows.push([a.code, a.name, a.type, a.category, a.location, a.fuel, a.count, a.qty, a.run, a.efficiency]));
  rows.push([]);
  rows.push(['BY LOCATION']);
  rows.push(['Location', 'Direct', 'Indirect', 'Total']);
  d.byLocation.forEach(x => rows.push([x.key, x.Direct, x.Indirect, x.total]));
  rows.push([]);
  rows.push(['BY VENDOR']);
  rows.push(['Vendor', 'Deliveries', 'Diesel', 'Petrol', 'Total', 'Amount']);
  d.byVendor.forEach(v => rows.push([v.vendor, v.count, v.Diesel, v.Petrol, v.total, v.amount]));
  rows.push([]);
  rows.push(['DETAILS']);
  rows.push(['Date', 'IN/OUT', 'Fuel', 'Qty (' + U() + ')', 'Vendor / Asset', 'Place / Source', 'Category', 'Meter', 'By', 'Ref']);
  d.details.forEach(x => rows.push([x.date, x.kind, x.fuel, x.qty, x.party, x.place, x.category, x.meter, x.by, x.ref]));
  const blob = new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `PFC_Fuel_Report_${d.from}_to_${d.to}.csv`; a.click();
}

$('btnExport').onclick = async () => {
  if (!lastParams) return;
  const b = $('btnExport'); b.disabled = true;
  try {
    const p = Object.assign({ logoUrl: new URL('logo.png', location.href).href }, lastParams);
    const res = await api('export', { params: p });
    toast(tm('sheetDone')); window.open(res.url, '_blank');
  } catch (e) { toast(e.net ? tm('needNet') : e.message, true); }
  finally { b.disabled = false; }
};

/* ================= Start ================= */
(function start() {
  const td = today();
  document.querySelectorAll('input[type=date][name=date]').forEach(i => i.value = td);
  const nm = load(K.name, '');
  document.querySelectorAll('.myname').forEach(i => i.value = nm);
  $('fSet').elements.url.value = cfg.url || '';
  $('fSet').elements.pin.value = cfg.pin || '';
  setRange('month');
  applyLang();
  if (!cfg.url) showTab('set');

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.addEventListener('online', () => { netOk = true; trySync(); });
  window.addEventListener('offline', () => { netOk = false; setStatus(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) trySync(); });
  setInterval(() => { if (queue.length) trySync(); }, 60000);
  trySync();
})();
</script>
